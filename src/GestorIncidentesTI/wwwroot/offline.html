<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">

<body class="estado">
    <main class="estado-centrado estado-texto" role="status" aria-live="polite">
        <div class="senal" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p class="estado-etiqueta">Sin señal</p>

        <div class="estado-acciones">
            <span class="reintento"><svg viewBox="0 0 24 24" aria-hidden="true"><circle class="fondo" cx="12" cy="12" r="9"/><circle id="valor" class="valor" cx="12" cy="12" r="9" pathLength="1"/></svg><span id="texto">Reintento automático en 8 s</span></span>
            <button type="button" id="reintentar" class="boton boton-primario">Reintentar ahora</button>
        </div>
    </main>
    <script src="/js/offline.js"></script>
